name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  S3_BUCKET: group13capstonebucket
  CLOUDFRONT_ID: ECUXP1DUSC95X
  TARGET_GROUP_ARN: arn:aws:elasticloadbalancing:us-east-1:230195035490:targetgroup/group13-targetgroup/c310152094d67bf9

jobs:
  deploy-s3:
    name: Deploy Static Assets to S3
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync all files to S3
        run: |
          aws s3 sync ./assets s3://${{ env.S3_BUCKET }}/assets \
            --delete \
            --cache-control "max-age=86400"
          aws s3 cp ./index.html s3://${{ env.S3_BUCKET }}/index.html
          aws s3 sync ./pages s3://${{ env.S3_BUCKET }}/pages --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_ID }} \
            --paths "/*"

  deploy-ec2:
    name: Deploy Web App to EC2
    runs-on: ubuntu-latest
    needs: deploy-s3
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Discover all healthy instances in target group
        id: targets
        run: |
          INSTANCE_IDS=$(aws elbv2 describe-target-health \
            --target-group-arn ${{ env.TARGET_GROUP_ARN }} \
            --region ${{ env.AWS_REGION }} \
            --query 'TargetHealthDescriptions[?TargetHealth.State==`healthy`].Target.Id' \
            --output text | tr '\t' ' ')
          echo "instance_ids=$INSTANCE_IDS" >> $GITHUB_OUTPUT
          echo "Deploying to instances: $INSTANCE_IDS"

      - name: Deploy via SSM to all healthy instances
        id: ssm
        run: |
          INSTANCE_IDS="${{ steps.targets.outputs.instance_ids }}"
          if [ -z "$INSTANCE_IDS" ]; then
            echo "No healthy instances found in target group"
            exit 1
          fi

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids $INSTANCE_IDS \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -e",
              "aws s3 sync s3://group13capstonebucket/assets /var/www/html/assets --delete",
              "aws s3 cp s3://group13capstonebucket/index.html /var/www/html/index.html",
              "aws s3 sync s3://group13capstonebucket/pages /var/www/html/pages --delete",
              "chown -R apache:apache /var/www/html/",
              "chmod -R 755 /var/www/html/",
              "systemctl reload httpd",
              "echo Deployment complete: $(date)"
            ]' \
            --region ${{ env.AWS_REGION }} \
            --query 'Command.CommandId' \
            --output text)
          echo "command_id=$COMMAND_ID" >> $GITHUB_OUTPUT
          echo "SSM Command ID: $COMMAND_ID"

      - name: Wait for SSM command to complete on all instances
        run: |
          for INSTANCE_ID in ${{ steps.targets.outputs.instance_ids }}; do
            echo "Waiting for $INSTANCE_ID..."
            aws ssm wait command-executed \
              --command-id ${{ steps.ssm.outputs.command_id }} \
              --instance-id "$INSTANCE_ID" \
              --region ${{ env.AWS_REGION }}
          done

      - name: Check SSM result on all instances
        run: |
          FAILED=0
          for INSTANCE_ID in ${{ steps.targets.outputs.instance_ids }}; do
            RESULT=$(aws ssm get-command-invocation \
              --command-id ${{ steps.ssm.outputs.command_id }} \
              --instance-id "$INSTANCE_ID" \
              --region ${{ env.AWS_REGION }} \
              --query '{Status:Status,Error:StandardErrorContent}' \
              --output json)
            STATUS=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin)['Status'])")
            echo "$INSTANCE_ID: $STATUS"
            if [ "$STATUS" != "Success" ]; then
              echo "  ERROR: $(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin)['Error'])")"
              FAILED=1
            fi
          done
          [ "$FAILED" -eq 0 ] || exit 1

      - name: Verify health check through CloudFront
        run: |
          sleep 5
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://group13capstone.online/health)
          if [ "$STATUS" != "200" ]; then
            echo "Health check failed: HTTP $STATUS"
            exit 1
          fi
          echo "Health check passed: HTTP $STATUS"
